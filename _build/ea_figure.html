      <text transform="translate(57.1 4465.5)" style="fill:#333;font-size:24px;font-family:Merriweather, serif;font-weight:700"><tspan x="0" y="0">Prioritization</tspan></text>
      <text transform="translate(57.1 4511.6)" style="fill:#333;font-family:Merriweather, serif;font-size:18px"><tspan x="0" y="0">Our intuitions don’t do a good job at </tspan><tspan x="0" y="21.6">estimating the scale of our impact, </tspan><tspan x="0" y="43.2">so we use numbers to weigh how </tspan><tspan x="0" y="64.8">much different actions help.</tspan></text>

      <text transform="translate(57.1 4674.4)" style="fill:#333;font-size:24px;font-family:Merriweather, serif;font-weight:700"><tspan x="0" y="0">Impartial altruism</tspan></text>
      <text transform="translate(57.1 4720.3)" style="fill:#333;font-family:Merriweather, serif;font-size:18px"><tspan x="0" y="0">We aim to weigh everyone’s </tspan><tspan x="0" y="21.6">interests equally when trying to do </tspan><tspan x="0" y="43.2">good. This leads to focusing on </tspan><tspan x="0" y="64.8">groups that are the most neglected.</tspan></text>

    <div class="vcard-m vm-tl reveal" style="--i:0"><h4>Prioritization</h4><span class="vd"></span><p>Our intuitions don’t do a good job at estimating the scale of our impact, so we use numbers to weigh how much different actions help.</p></div><div class="vcard-m vm-tr reveal" style="--i:1"><h4>Open truthseeking</h4><span class="vd"></span><p>We consider many different ways to help, staying open to new evidence and arguments. We are ready to change our views quite radically.</p></div><div class="vcard-m vm-bl reveal" style="--i:3"><h4>Impartial altruism</h4><span class="vd"></span><p>We aim to weigh everyone’s interests equally when trying to do good. This leads to focusing on groups that are the most neglected.</p></div><div class="vcard-m vm-br reveal" style="--i:4"><h4>Collaborative spirit</h4><span class="vd"></span><p>We can achieve more by working together. To do this effectively, we have high standards of honesty, integrity, and compassion.</p></div>
